# Node web service. The process serves the Vite build and runs queries with the
# libraries installed in node_modules. Vite inlines nothing from DATA_MODE; the
# server reads it on each boot. Never put a service-role key here.
services:
  - type: web
    name: worldpulse
    runtime: node
    plan: free
    branch: main
    # Build heap is 384MB. Do not set NODE_OPTIONS on the service: Render
    # applies it to the build too, and Vite OOMs at 256MB.
    buildCommand: python3 -m pip install --user -r pipelines/hail/requirements.txt && npm ci --include=dev && NODE_OPTIONS=--max-old-space-size=384 npm run build:web
    startCommand: NODE_OPTIONS=--max-old-space-size=256 node dist-server/index.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Quoted so YAML does not read the version as the number 22.16.
      - key: NODE_VERSION
        value: "22.16.0"
      - key: PYTHON
        value: python3
      - key: DATA_MODE
        value: supabase
      - key: OVERTURE_RELEASE
        value: "2026-10-21.0"
      - key: WORKFLOW_MAX_ROWS_PER_DATASET
        value: "8000"
      - key: WORKFLOW_MAX_TOTAL_ROWS
        value: "20000"
    previews:
      generation: automatic
