# Node web service. The process serves the Vite build and runs queries with the
# libraries installed in node_modules. Vite inlines nothing from DATA_MODE; the
# server reads it on each boot. Never put a service-role key here.
services:
  - type: web
    name: worldpulse
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist-server/index.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Quoted so YAML does not read the version as the number 22.16.
      - key: NODE_VERSION
        value: "22.16.0"
      - key: DATA_MODE
        value: mock
    previews:
      generation: automatic
